services:
  # SQL Server database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    environment:
      SA_PASSWORD: "SqlServer@2026"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./mssql_data:/var/opt/mssql/data
    networks:
      - data-eng-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'SqlServer@2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL for Airflow metadata database (lighter than using Airflow's SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-metadata
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: Airflow@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-eng-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Airflow task queue (optional, needed for CeleryExecutor)
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - data-eng-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Engineering Container
  data-engineer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-engineer-app
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:Airflow%402026@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
      SQL_SERVER_HOST: mssql
      SQL_SERVER_USER: SA
      SQL_SERVER_PASSWORD: "SqlServer@2026"
      SQL_SERVER_DATABASE: master
    ports:
      - "8080:8080"  # Airflow Web UI
      - "8793:8793"  # Airflow Scheduler
    volumes:
      - ./dags:/home/airflow/dags
      - ./logs:/home/airflow/logs
      - ./plugins:/home/airflow/plugins
      - ./data:/home/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-eng-network
    command: bash -c "sleep 15 && airflow db init && (airflow webserver --port 8080 > /dev/null 2>&1 &) && airflow scheduler"

volumes:
  postgres_data:
    driver: local

networks:
  data-eng-network:
    driver: bridge
